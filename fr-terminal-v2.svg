<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="title desc">
  <title id="title">FR(); — fresforge terminal identity</title>
  <desc id="desc">Antonio Andrés, a Computer Engineering student focused on software engineering, backend systems and cloud.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090a0f"/>
      <stop offset="0.68" stop-color="#0a0b12"/>
      <stop offset="1" stop-color="#0d0b18"/>
    </linearGradient>
    <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f4f8"/>
      <stop offset="0.52" stop-color="#ded9ff"/>
      <stop offset="1" stop-color="#9e88f7"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#9e88f7" stroke-width="0.55" opacity="0.10"/>
    </pattern>
    <clipPath id="brandZone"><rect x="18" y="56" width="394" height="266" rx="10"/></clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .reveal { opacity: 0; transform: translateY(7px); animation: reveal .42s cubic-bezier(.2,.8,.2,1) forwards; }
    .mark { fill: none; stroke: url(#fr); stroke-width: 27; stroke-linecap: square; stroke-linejoin: bevel; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.15s cubic-bezier(.4,0,.2,1) forwards; }
    .mark-back { fill: none; stroke: #332857; stroke-width: 27; stroke-linecap: square; stroke-linejoin: bevel; opacity: .82; }
    .paren { fill: none; stroke: #969aa3; stroke-width: 13; stroke-linecap: square; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .72s .72s cubic-bezier(.4,0,.2,1) forwards; }
    .punct { fill: #9e88f7; opacity: 0; animation: pop .32s 1.18s cubic-bezier(.2,.9,.2,1.2) forwards; }
    .trace { fill: none; stroke: #9e88f7; stroke-width: 1; opacity: .23; }
    .key { fill: #9e88f7; font-size: 13px; }
    .value { fill: #f3f4f8; font-size: 13px; }
    .cursor { animation: blink 1s steps(1,end) infinite; }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; animation: none; } .mark,.paren { stroke-dashoffset: 0; animation: none; } .punct { opacity: 1; animation: none; } .cursor { animation: none; } }
  </style>
  <rect width="860" height="350" rx="14" fill="url(#panel)"/>
  <rect x="0.75" y="0.75" width="858.5" height="348.5" rx="13.25" fill="none" stroke="#292733" stroke-width="1.5"/>
